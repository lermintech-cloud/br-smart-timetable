<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101d3f;--ink2:#1b2c5c;--blue:#27409f;--sky:#eceff8;--gold:#e8a900;--ruby:#c2303f;--mint:#1f8a70;--bg:#f5f2ea;--card:#fffdf8;--line:#e4ddcf;--tx:#1d2336;--mut:#767a8c}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--ink);background:#fff}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}.btn.pri:hover{background:var(--ink2)}.btn.dng{color:var(--ruby);border-color:#ecc3c8}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2000;font-weight:600}.btn.big{padding:13px 30px;font-size:16px;border-radius:10px}.btn:disabled{opacity:.4;cursor:not-allowed}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;max-width:100%}input:focus,select:focus,textarea:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pal{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:6px;color:var(--mut)}
.chip{padding:5px 11px;border-radius:8px;cursor:grab;background:hsl(var(--h) 80% 94%);border:1px solid hsl(var(--h) 45% 72%);border-left:4px solid hsl(var(--h) 60% 48%);color:hsl(var(--h) 50% 22%);font-weight:500;user-select:none;transition:.15s}.chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px #101d3f22}.chip:active{cursor:grabbing}.chip em{font-style:normal;font-size:11.5px;opacity:.7;margin-left:7px}.chip.done{opacity:.5}

table.g{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;table-layout:fixed}
.g th,.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;vertical-align:top;height:78px}
.g thead th{height:auto;background:#f0ebdf;color:var(--ink);padding:9px 4px;font-size:13px;font-weight:600;position:sticky;top:0;z-index:2}.g th small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.g tbody th{width:88px;background:#f0ebdf;color:var(--ink);vertical-align:middle;position:sticky;left:0;z-index:1}.g tbody th.tod{background:var(--ink);color:#fff}
.g tr:last-child td,.g tr:last-child th{border-bottom:0}.g th:last-child,.g td:last-child{border-right:0}
td.brk{background:repeating-linear-gradient(45deg,#f6f2e8,#f6f2e8 6px,#eee8d9 6px,#eee8d9 12px);text-align:center;vertical-align:middle;color:var(--mut);font-size:12px}
td.empty{transition:background .12s}td.empty:hover{background:#fff6d8}
td.ok{background:#eaf7f1}td.warn{background:#fff3cf}td.bad{background:repeating-linear-gradient(135deg,#fdeaec,#fdeaec 6px,#f9d3d8 6px,#f9d3d8 12px)}
td.over{outline:2px solid var(--ink);outline-offset:-3px}td.bad.over{outline-color:var(--ruby);cursor:not-allowed}
.ghost{font-size:10.5px;line-height:1.3;padding:1px 6px;margin:0 0 2px;border-radius:5px;border:1px dashed hsl(var(--h,220) 35% 62%);background:hsl(var(--h,220) 60% 95% / .7);color:hsl(var(--h,220) 30% 36%);opacity:.72;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost.same{border-style:solid;opacity:.92}.ghost.hit{border:1px solid var(--ruby);background:#fff;color:var(--ruby);opacity:1;font-weight:500}.ghost.more{border:0;background:none;opacity:.6}
.legend{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:9px 20px;font-size:12.5px;display:flex;gap:18px;z-index:60;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px #101d3f55}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.blk{background:hsl(var(--h) 80% 94%);border-left:4px solid hsl(var(--h) 60% 48%);border-radius:6px;padding:5px 8px;height:100%;margin-bottom:2px;font-size:13px}
.blk[data-act]{cursor:pointer}.blk[draggable=true]{cursor:grab}.blk b{display:block;color:hsl(var(--h) 55% 20%);font-weight:600}.blk small{color:hsl(var(--h) 25% 35%)}
table.t{width:100%;border-collapse:collapse}.t th,.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}.t th{color:var(--mut);font-weight:500;font-size:13px}.t input{width:100%}
.bargr{height:7px;border-radius:9px;background:#ece6d8;overflow:hidden;min-width:90px}.bargr i{display:block;height:100%;background:var(--blue)}.bargr i.ok{background:var(--mint)}.bargr i.hi{background:var(--ruby)}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;background:#ece6d8;color:var(--ink)}.tag.ok{background:#d9f0e7;color:#0b6b52}.tag.no{background:#fde2e6;color:var(--ruby)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mask{position:fixed;inset:0;background:#101d3f99;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}.modal h3{margin:0}.modal label{display:grid;gap:4px;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;max-width:90vw}.toast.bad{background:var(--ruby)}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.sheet header{display:flex;gap:14px;align-items:center;margin-bottom:10px}.sheet header img{width:62px}.sheet header b{font-size:18px;color:var(--ink)}

.sig{text-align:center;min-width:200px}.sig i{display:block;border-bottom:1px dotted #333;height:34px;margin-bottom:4px}
.wel{min-height:100vh;display:grid;place-items:center;padding:20px;background-color:var(--ink);background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:44px 44px}
.wel-in{text-align:center;color:#fff;max-width:640px;display:grid;gap:16px;justify-items:center}.wl{width:140px}
.wel h1{color:#fff;font-size:clamp(28px,6vw,46px);margin:0}.wf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.wf span{padding:5px 13px;border-radius:6px;border:1px solid #ffffff33;font-size:13px}
.wn b{color:var(--gold);font-size:22px}.cr{text-align:center;color:var(--mut);font-size:12px;padding:18px 0 4px}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;gap:0;overflow:visible;border-top:1px solid #ffffff22}.brand,.term,.grp,.sub2,.me,.nav small,.legend{display:none}.nav{flex-direction:column;gap:2px;padding:6px 2px;font-size:10.5px;text-align:center;flex:1}.nav.on::before{display:none}.badge{position:absolute;top:0;right:6px;margin:0}main{padding:18px 14px 96px}.toast{bottom:84px}}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff}.side,.noprint,.toast,.mask,.legend{display:none!important}.shell{display:block}main{padding:0;max-width:none}.sheet{border:0;padding:0;margin:0;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto}.gridw{border:0;overflow:visible}table.g{border-collapse:collapse;min-width:0}.g th,.g td{border:1px solid #444!important;height:50px}.g thead th,.g tbody th{background:#eee!important;color:#000;position:static}.blk{background:#fff!important;border:0;border-left:3px solid #000}.blk b,.blk small{color:#000!important}.sheet::after{content:'BR Smart Timetable · พัฒนาโดย ครูเฉลิมพล จันทร์แดง · โรงเรียนบ้านไร่';display:block;text-align:center;font-size:10px;color:#555;margin-top:8px}}

:root{--ink:#111827;--ink2:#1f2937;--blue:#3b5bfd;--gold:#f5a524;--ruby:#e5484d;--mint:#12a594;--bg:#f6f7fb;--card:#fff;--line:#e8eaf1;--tx:#111827;--mut:#6b7280;--r:18px}

<script>
const D=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'],$=s=>document.querySelector(s);
const S={view:'dash',mode:'class',sel:null,pm:'teacher1',ps:null,tab:'teachers',sd:new Date().toISOString().slice(0,10),d:{teachers:[],subjects:[],assignments:[],classes:[],rooms:[],periods:[],entries:[],subs:[],settings:{}},user:{name:'ผู้ใช้งาน',role:'admin'},entered:false,un:[],re:[],clip:null};
const by=(a,id)=>a.find(x=>x.id==id),col=s=>{let h=0;for(const c of String(s||''))h=(h*37+c.charCodeAt(0))%360;return h};
const canEdit=()=>S.user&&['admin','academic'].includes(S.user.role);
const opts=(l,s)=>l.map(x=>`<option value="${x.id}" ${x.id==s?'selected':''}>${x.name}</option>`).join('');
function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3400)}
async function api(p,m='GET',b){const t=localStorage.getItem('brt');const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status==401&&p!='login'){localStorage.removeItem('brt');S.user=null;render()}if(!r.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');return j}
async function load(){const d=await api('data');S.d=d;S.user=d.user}
async function act(fn,msg){try{await fn();await load();render();if(msg)toast(msg)}catch(e){toast(e.message=='Failed to fetch'?'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ ตรวจสอบอินเทอร์เน็ต':e.message,true)}}
const modal=h=>{$('#modal').innerHTML=h?`<div class="mask" data-act="maskclose"><div class="modal">${h}</div></div>`:''};
const term=()=>`ปีการศึกษา ${S.d.settings.year||''} ภาคเรียนที่ ${S.d.settings.term||''}`;

function welcomeH(){const d=S.d,h=new Date().getHours(),g=h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น';
 return `<div class="wel"><div class="wel-in"><img src="logo.png" alt="โลโก้โรงเรียนบ้านไร่" class="wl"><div style="opacity:.85">${g} · ยินดีต้อนรับสู่</div><h1>BR Smart Timetable</h1><p style="margin:0;opacity:.9">ระบบจัดตารางสอนอัจฉริยะ<br>โรงเรียนบ้านไร่ สพป.เชียงใหม่ เขต 5</p><div class="wf"><span>ลากวางจัดตาราง</span><span>ตรวจคาบชนอัตโนมัติ</span><span>จัดสอนแทน</span><span>พิมพ์ / PDF</span><span>ฉบับตาราง & สำรองข้อมูล</span></div><button class="btn gold big" data-act="enter">เข้าสู่ระบบจัดตารางสอน</button><div class="wn"><b>${d.teachers.length}</b> ครู · <b>${d.classes.length}</b> ชั้นเรียน · <b>${d.entries.length}</b> คาบ</div><small style="opacity:.75">${term()}<br>พัฒนาโดย ครูเฉลิมพล จันทร์แดง · โรงเรียนบ้านไร่</small></div></div>`}
const IC={home:'M3 11l9-8 9 8M5 10v10h14V10',grid:'M3 4h18v16H3zM3 10h18M9 4v16',swap:'M7 7h13l-3-3M17 17H4l3 3',print:'M7 8V3h10v5M7 17H4v-6h16v6h-3M7 14h10v7H7z',db:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6',save:'M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7'};
const NAV=[['ภาพรวม',[['dash','แดชบอร์ด','สถิติและการแจ้งเตือน','home']]],['จัดตาราง',[['tt','จัดตารางสอน','ลากวางและตรวจคาบชน','grid'],['sub','สอนแทน','มอบหมายครูแทนรายวัน','swap']]],['เอกสาร',[['print','พิมพ์ตารางสอน','รายครู รายชั้น รายห้อง','print']]],['ระบบ',[['data','ข้อมูลพื้นฐาน','ครู วิชา ชั้น ห้อง เวลา','db'],['ver','ฉบับตาราง/สำรอง','ฉบับร่าง สำรอง ประวัติ','save']]]];
function render(){
 if(!S.entered){$('#app').innerHTML=welcomeH();return}
 const cf=conflicts().length,un=(S.d.notifs||[]).filter(x=>!x.seen).length,bd={dash:un?`<b class="badge n">${un}</b>`:'',tt:cf?`<b class="badge">${cf}</b>`:''};
 const V={dash:vDash,tt:vTT,print:vPrint,sub:vSub,data:vData,ver:vVer}[S.view]();

function autoSched(o){const d=S.d,P=d.periods.filter(p=>!+p.is_break).map(p=>p.id),days=[1,2,3,4,5],L=d.assignments||[];
 const base=o.keep?d.entries.map(e=>({...e})):[],need=[];
 for(const a of L){const have=base.filter(e=>e.class_id==a.class_id&&e.subject_id==a.subject_id).length;for(let i=have;i<(a.periods||0);i++)need.push(a)}
 const load={};need.forEach(a=>load[a.teacher_id]=(load[a.teacher_id]||0)+1);let best=null;
 for(let it=0;it<150;it++){
  const T={},C={},R={},TD={},CS={},rows=base.map(e=>({...e})),un=[];let sc=0;
  const mark=e=>{const k=(x,y)=>x+'|'+e.day+(y?'|'+e.period:'');T[k(e.teacher_id,1)]=1;C[k(e.class_id,1)]=1;if(e.room_id)R[k(e.room_id,1)]=1;TD[k(e.teacher_id)]=(TD[k(e.teacher_id)]||0)+1;const cs=e.class_id+'|'+e.subject_id+'|'+e.day;CS[cs]=(CS[cs]||0)+1};
  rows.forEach(mark);
  const order=need.map(a=>({a,k:(load[a.teacher_id]||0)+Math.random()*6+(a.room_id?4:0)})).sort((x,y)=>y.k-x.k).map(x=>x.a);
  for(const a of order){const cd=by(d.subjects,a.subject_id)?.code||'';let pick=null,ps=-1e9;
   for(const day of days)for(let i=0;i<P.length;i++){const p=P[i];
    if(T[a.teacher_id+'|'+day+'|'+p]||C[a.class_id+'|'+day+'|'+p]||(a.room_id&&R[a.room_id+'|'+day+'|'+p])||(TD[a.teacher_id+'|'+day]||0)>=o.tmax)continue;
    let s=Math.random()*5-(TD[a.teacher_id+'|'+day]||0)*1.5;
    if(o.spread)s-=(CS[a.class_id+'|'+a.subject_id+'|'+day]||0)*50;
    if(o.core&&cd&&'ทคว'.includes(cd))s+=i<4?8:-8;
    if(o.light&&cd&&'พศง'.includes(cd))s+=i>=4?8:-8;
    if(s>ps){ps=s;pick={day,p}}}
   if(!pick){un.push(a);continue}
   const e={id:null,class_id:a.class_id,subject_id:a.subject_id,teacher_id:a.teacher_id,room_id:a.room_id||null,day:pick.day,period:pick.p};rows.push(e);mark(e);sc+=ps}
  if(!best||un.length<best.un.length||(un.length==best.un.length&&sc>best.sc))best={rows,un,sc,T,C};
  if(!un.length&&!o.spread&&!o.core&&!o.light)break}
 const rep=[],gu={};best.un.forEach(a=>{const k=a.class_id+'|'+a.subject_id;(gu[k]=gu[k]||{a,n:0}).n++});
 for(const {a,n} of Object.values(gu).slice(0,8)){let cf=0,tf=0;for(const day of days)for(const p of P)if(!best.C[a.class_id+'|'+day+'|'+p]){cf++;if(!best.T[a.teacher_id+'|'+day+'|'+p])tf++}
  rep.push([`${by(d.classes,a.class_id)?.name} · ${by(d.subjects,a.subject_id)?.name} ขาด ${n} คาบ — ${!cf?'ชั้นนี้เต็มทุกคาบแล้ว':!tf?'ครู'+(by(d.teachers,a.teacher_id)?.name||'')+'ไม่ว่างในคาบที่ชั้นนี้ว่าง':'ติดเงื่อนไข ลองปิดบางข้อหรือเพิ่มจำนวนคาบสูงสุดต่อวันของครู'}`,1])}
 const cs={};let v=0;best.rows.forEach(e=>{const k=e.class_id+'|'+e.subject_id+'|'+e.day;cs[k]=(cs[k]||0)+1;if(cs[k]>1)v++});
 if(o.spread&&v)rep.push([`วิชาซ้ำวันเดียวกัน ${v} ครั้ง (ที่ว่างไม่พอจึงจำเป็นต้องซ้ำ)`,1]);
 if(!best.un.length)rep.push(['จัดครบทุกรายการ ไม่มีครู ห้อง หรือชั้นชนคาบ',0]);
 return{rows:best.rows,un:best.un,placed:best.rows.length-base.length,rep}}

 const row=a=>`<tr data-as="${a.id||''}">${[[d.classes,'class_id','ชั้น'],[d.subjects,'subject_id','วิชา'],[d.teachers,'teacher_id','ครู'],[d.rooms,'room_id','ห้อง (ถ้ามี)']].map(x=>`<td>${sl(x[0],a[x[1]],x[1],x[2])}</td>`).join('')}<td><input data-ak="periods" type="number" min="1" value="${a.periods||''}" style="width:70px" ${on?'':'disabled'}></td><td>${on?(a.id?`<button class="btn dng" data-act="asgdel" data-id="${a.id}">ลบ</button>`:'<button class="btn pri" data-act="asgadd">เพิ่ม</button>'):''}</td></tr>`;

 saveuser:()=>act(()=>api('users','POST',{username:$('#u1').value,name:$('#u2').value,password:$('#u3').value,role:$('#u4').value}),'บันทึกผู้ใช้แล้ว')
};
function saveRow(tr){const b={id:tr.dataset.id||undefined};tr.querySelectorAll('input').forEach(i=>b[i.dataset.k]=i.type=='number'?+i.value:i.value);if(!(b.name||b.label))return toast('กรุณากรอกชื่อ',true);act(()=>api('crud/'+tr.dataset.t,'POST',b),'บันทึกแล้ว')}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(e){if(e.dataset.act=='logout')ev.preventDefault();return A[e.dataset.act]?.(e,ev)}
 const td=ev.target.closest('td.empty[data-d]');if(td&&canEdit()&&S.mode=='class')entryModal(S.clip?{...S.clip,id:0,class_id:S.sel,day:+td.dataset.d,period:+td.dataset.p}:{class_id:S.sel,day:+td.dataset.d,period:+td.dataset.p,subject_id:S.d.subjects[0]?.id})});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.ch;
 if(k=='restore'){doRestore(t.files[0]);return}if(k){S[k=='sel'?(S.view=='print'?'ps':'sel'):k]=k=='mode'?t.value:k=='sd'||k=='pm'?t.value:+t.value;if(k=='mode')S.sel=null;if(k=='pm')S.ps=null;render();return}
 const tr=t.closest('tr[data-t]');if(tr&&tr.dataset.id)saveRow(tr)});
document.addEventListener('submit',async ev=>{if(ev.target.id!='lf')return;ev.preventDefault();const f=ev.target;try{const r=await api('login','POST',{username:f.u.value.trim(),password:f.p.value});localStorage.setItem('brt',r.token);await load();render()}catch(e){toast(e.message,true)}});
function ghostCtx(k,id){const d=S.d;if(k=='S')return{k,sid:+id,t:new Set(d.entries.filter(e=>e.subject_id==id).map(e=>e.teacher_id)),r:null,ex:0};const e=by(d.entries,id);return e?{k,sid:e.subject_id,t:new Set([e.teacher_id]),r:e.room_id,ex:e.id}:null}
function paintGhosts(c){document.querySelectorAll('td.empty[data-d]').forEach(td=>{
 const es=S.d.entries.filter(e=>e.day==td.dataset.d&&e.period==td.dataset.p&&e.class_id!=S.sel&&e.id!=c.ex);
 const hit=e=>c.t.has(e.teacher_id)||(c.r&&e.room_id==c.r),busy=new Set(es.map(e=>e.teacher_id));
 const bad=c.k=='E'&&es.some(hit),warn=c.k=='S'&&c.t.size>0&&[...c.t].every(t=>busy.has(t));
 td.classList.add(bad?'bad':warn?'warn':'ok');
 const rank=e=>hit(e)?0:e.subject_id==c.sid?1:2,so=[...es].sort((a,b)=>rank(a)-rank(b));
 td.insertAdjacentHTML('beforeend',so.slice(0,3).map(e=>{const sj=by(S.d.subjects,e.subject_id),tc=by(S.d.teachers,e.teacher_id);return `<div class="ghost ${hit(e)?'hit':e.subject_id==c.sid?'same':''}" style="--h:${col(sj?.name)}" title="${tc?.name||''}">${by(S.d.classes,e.class_id)?.name} · ${sj?.name}</div>`}).join('')+(so.length>3?`<div class="ghost more">+${so.length-3} ชั้นอื่น</div>`:''))})}
function clearGhosts(){S.drag=null;document.querySelectorAll('.ghost').forEach(x=>x.remove());document.querySelectorAll('td.ok,td.warn,td.bad,td.over').forEach(x=>x.classList.remove('ok','warn','bad','over'));document.querySelector('.legend')?.remove()}
document.addEventListener('dragstart',ev=>{const t=ev.target.closest('[data-drag]');if(!t)return;ev.dataTransfer.setData('text/plain',t.dataset.drag);ev.dataTransfer.effectAllowed='move';const [k,id]=t.dataset.drag.split(':'),c=ghostCtx(k,+id);if(!c)return;S.drag=c;
 setTimeout(()=>{paintGhosts(c);document.body.insertAdjacentHTML('beforeend','<div class="legend"><span><i style="background:#fff;border:1px dashed #8a93b5"></i>เงา = ชั้นอื่นใช้คาบนี้อยู่</span><span><i style="background:#f3a6b0"></i>ครู/ห้องชน วางไม่ได้</span><span><i style="background:#ffd666"></i>ครูวิชานี้ติดทุกคน</span></div>')},0)});
document.addEventListener('dragover',ev=>{const td=ev.target.closest('td.empty[data-d]');document.querySelectorAll('td.over').forEach(x=>x.classList.remove('over'));if(td){if(!(S.drag?.k=='E'&&td.classList.contains('bad'))){ev.preventDefault();ev.dataTransfer.dropEffect='move'}td.classList.add('over')}});
document.addEventListener('drop',ev=>{const td=ev.target.closest('td.empty[data-d]');if(!td)return;ev.preventDefault();const bad=td.classList.contains('bad')&&S.drag?.k=='E',[k,id]=ev.dataTransfer.getData('text/plain').split(':'),day=+td.dataset.d,period=+td.dataset.p;clearGhosts();
 if(bad)return toast('ครูหรือห้องนี้ติดคาบอื่นในช่วงเวลานั้น วางไม่ได้',true);
 if(k=='S')entryModal({class_id:S.sel,day,period,subject_id:+id});else if(k=='E'){const e=by(S.d.entries,id);snap();act(()=>api('entry','POST',{...e,day,period}),'ย้ายคาบแล้ว')}});
document.addEventListener('dragend',clearGhosts);
document.addEventListener('input',ev=>{if(ev.target.id!='q')return;const v=ev.target.value.trim();document.querySelectorAll('.blk,.chip').forEach(b=>b.style.opacity=!v||b.textContent.includes(v)?1:.18)});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')modal('')});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key=='z'&&S.view=='tt'&&!/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)){ev.preventDefault();(ev.shiftKey?A.redo:A.undo)()}});
(async()=>{render();try{await load()}catch(e){toast(e.message,true)}render()})();
</script></body></html>
